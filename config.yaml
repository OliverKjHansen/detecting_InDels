# ---------------------------------------------------------------------------
# Cluster
# ---------------------------------------------------------------------------

paths:
  fasta:       "~/mutationalscanning/DerivedData/fasta/HiFi"
  bam:         "~/mutationalscanning/DerivedData/bam/HiFi"
  read_labels: "~/mutationalscanning/Workspaces/pepo/de_novo_assembly/results/read_info"
  classification: "~/mutationalscanning/Workspaces/pepo/de_novo_assembly/results/classification"

  output:   "output"
  results:   "results"
  plots:   "plots"

tools:
  mreps: "~/mutationalscanning/Workspaces/oliver/microsatellites/development/mreps/mreps"
  trf:   "~/mutationalscanning/Workspaces/oliver/microsatellites/development/TRF/build/src/trf"

# ---------------------------------------------------------------------------
# File layout. These templates are the single source of truth for where data
# lives; workflows never build paths by hand. Placeholders are filled from
# `paths` and `assembly_type` above, plus species/sample/contig/model, the period
# k, the haplotype (hap1 or hap2), and, for files written per window of a
# contig, start/end.
# ---------------------------------------------------------------------------
layout:
  # Raw inputs.
  assembly:     "{fasta}/{species}/{sample}/{assembly_type}_assembly/{sample}_{assembly_type}.fa"
  assembly_fai: "{fasta}/{species}/{sample}/{assembly_type}_assembly/{sample}_{assembly_type}.fa.fai"
  haploid:      "{fasta}/{species}/{sample}/haploid_assembly/{sample}_haploid.fa"
  alignment:    "{bam}/{species}/{sample}/kinetics/{sample}_kinetics_{assembly_type}.bam"
  read_labels:  "{read_labels}/{species}/{sample}/{sample}_read_labels.txt"

  # Written by precompute.py.
  contig_fasta: "{output}/precompute/{species}/{sample}/contigs/{contig}.fa"
  long_contigs: "{output}/precompute/{species}/{sample}/long_contigs.bed"
  coverage:     "{output}/precompute/{species}/{sample}/avg_coverage.txt"
  unresolved_window: "{output}/precompute/{species}/{sample}/unresolved_haplotypes/chunks/{contig}_{start}_{end}.bed"
  unresolved:   "{output}/precompute/{species}/{sample}/unresolved_haplotypes/{contig}.bed"
  unresolved_summary: "{results}/precompute/{species}/{sample}/unresolved_summary.tsv"
  tissue:       "{output}/precompute/{species}/{sample}/sorted_tissue_classification.tsv"
  read_classification: "{output}/precompute/{species}/{sample}/read_classification.tsv"
  read_bins:    "{output}/precompute/{species}/{sample}/read_bins.npz"
  smrt_cells:   "{output}/precompute/{species}/{sample}/smrt_cells.tsv"
  haplotype_assembly: "{output}/precompute/{species}/{sample}/haplotypes/{haplotype}.fa"

  # Written by repetitive_dna.py: per period k (M1 also per window), then one
  # BED per contig per model, and per sample. repeat_bases is every base in a
  # tract of the model before overlap resolution, as merged intervals.
  repeats_per_k:         "{output}/repetitive_dna/{species}/{sample}/per_k/{contig}_{model}_k{k}.bed"
  repeats_per_k_window:  "{output}/repetitive_dna/{species}/{sample}/per_k/{contig}_{model}_k{k}_{start}.bed"
  tandem_repeats:        "{output}/repetitive_dna/{species}/{sample}/{contig}_{model}.bed"
  repeat_bases:          "{output}/repetitive_dna/{species}/{sample}/bases/{contig}_{model}.bed"
  tandem_repeats_sample: "{output}/repetitive_dna/{species}/{sample}/{model}.bed"
  repeats_summary:       "{results}/repetitive_dna/{species}/{sample}/{model}_summary.tsv"
  repeats_dropped_summary: "{results}/repetitive_dna/{species}/{sample}/{model}_dropped.tsv"
  # The excluded group, also by repetitive_dna.py: homopolymer runs and tracts
  # with periods above repeats.periods (TRF per window), per contig, their
  # union, and the bases they cover per sample.
  homopolymers:          "{output}/repetitive_dna/{species}/{sample}/excluded/{contig}_homopolymers.bed"
  long_periods_window:   "{output}/repetitive_dna/{species}/{sample}/excluded/chunks/{contig}_long_periods_{start}.bed"
  long_periods:          "{output}/repetitive_dna/{species}/{sample}/excluded/{contig}_long_periods.bed"
  excluded:              "{output}/repetitive_dna/{species}/{sample}/excluded/{contig}.bed"
  excluded_summary:      "{results}/repetitive_dna/{species}/{sample}/excluded_summary.tsv"

  # Per-read cell-type likelihoods from the methylation model.
  likelihoods: "{classification}/{species}/{sample}/{sample}/05_ReadsClassification/{sample}_All_Reads_Likelihood_merged.tsv"

  # Written by indel_mutation_call.py (workflow 3). The scans' opportunity
  # tables and the FASTQs are big, so gzipped (ticket 32); from the merge on,
  # the opportunities are a cube in Parquet, queried with DuckDB (ticket 40).
  nonrepetitive_mask:                 "{output}/nonrepetitive_indels/{species}/{sample}/mask/{contig}.bed"
  nonrepetitive_window_calls:         "{output}/nonrepetitive_indels/{species}/{sample}/calls/chunks/{contig}_{start}_{end}.tsv"
  nonrepetitive_window_opportunities: "{output}/nonrepetitive_indels/{species}/{sample}/opportunities/chunks/{contig}_{start}_{end}.tsv.gz"
  nonrepetitive_window_reads:         "{output}/nonrepetitive_indels/{species}/{sample}/fastq/chunks/{contig}_{start}_{end}.fastq.gz"
  nonrepetitive_calls:                "{output}/nonrepetitive_indels/{species}/{sample}/calls/{contig}.tsv"
  nonrepetitive_opportunities:        "{output}/nonrepetitive_indels/{species}/{sample}/opportunities/{contig}.parquet"
  nonrepetitive_reads:                "{output}/nonrepetitive_indels/{species}/{sample}/fastq/{contig}.fastq.gz"
  nonrepetitive_haploid_reads:        "{output}/nonrepetitive_indels/{species}/{sample}/haploid/all.fastq.gz"
  nonrepetitive_haploid_bam:          "{output}/nonrepetitive_indels/{species}/{sample}/haploid/remapped.bam"
  nonrepetitive_haploid_locations:    "{output}/nonrepetitive_indels/{species}/{sample}/haploid/locations.tsv"
  nonrepetitive_haplotype_bam:        "{output}/nonrepetitive_indels/{species}/{sample}/haploid/{haplotype}.bam"
  nonrepetitive_haplotype_locations:  "{output}/nonrepetitive_indels/{species}/{sample}/haploid/{haplotype}_locations.tsv"
  nonrepetitive_merged_calls:         "{output}/nonrepetitive_indels/{species}/{sample}/merged/indels.tsv"
  nonrepetitive_merged_opportunities: "{output}/nonrepetitive_indels/{species}/{sample}/merged/opportunities.parquet"
  nonrepetitive_plots:                "{plots}/nonrepetitive_indels/{species}/{sample}/plots.pdf"
  nonrepetitive_results_calls:        "{results}/nonrepetitive_indels/{species}/{sample}/indels.tsv"
  nonrepetitive_results_opportunities: "{results}/nonrepetitive_indels/{species}/{sample}/opportunities.parquet"
  nonrepetitive_results_report:       "{results}/nonrepetitive_indels/{species}/{sample}/filter_report.tsv"
  nonrepetitive_results_classified:   "{results}/nonrepetitive_indels/{species}/{sample}/indels_classified.tsv"
  nonrepetitive_classification_reads: "{results}/nonrepetitive_indels/{species}/{sample}/classification_reads.tsv"
  nonrepetitive_rates_by_filter:      "{results}/nonrepetitive_indels/{species}/{sample}/rates_by_filter.tsv"
  nonrepetitive_rates_funnel:         "{results}/nonrepetitive_indels/{species}/{sample}/rates_funnel.tsv"

  # Written by repetitive_indel_call.py (workflow 4): the reads and their
  # remapping are shared by the models, everything else is per model.
  repetitive_tracts:               "{output}/repetitive_indels/{species}/{sample}/{model}/tracts/{contig}.bed"
  repetitive_tracts_summary:       "{results}/repetitive_indels/{species}/{sample}/tracts_summary.tsv"
  repetitive_window_calls:        "{output}/repetitive_indels/{species}/{sample}/{model}/calls/chunks/{contig}_{start}_{end}.tsv"
  repetitive_window_opportunities: "{output}/repetitive_indels/{species}/{sample}/{model}/opportunities/chunks/{contig}_{start}_{end}.tsv.gz"
  repetitive_window_reads:         "{output}/repetitive_indels/{species}/{sample}/fastq/chunks/{contig}_{start}_{end}.fastq.gz"
  repetitive_calls:                "{output}/repetitive_indels/{species}/{sample}/{model}/calls/{contig}.tsv"
  repetitive_opportunities:        "{output}/repetitive_indels/{species}/{sample}/{model}/opportunities/{contig}.parquet"
  repetitive_reads:                "{output}/repetitive_indels/{species}/{sample}/fastq/{contig}.fastq.gz"
  repetitive_haploid_reads:        "{output}/repetitive_indels/{species}/{sample}/haploid/all.fastq.gz"
  repetitive_haploid_bam:          "{output}/repetitive_indels/{species}/{sample}/haploid/remapped.bam"
  repetitive_haploid_locations:    "{output}/repetitive_indels/{species}/{sample}/haploid/locations.tsv"
  repetitive_haplotype_bam:        "{output}/repetitive_indels/{species}/{sample}/haploid/{haplotype}.bam"
  repetitive_haplotype_locations:  "{output}/repetitive_indels/{species}/{sample}/haploid/{haplotype}_locations.tsv"
  repetitive_merged_calls:         "{output}/repetitive_indels/{species}/{sample}/{model}/merged/indels.tsv"
  repetitive_merged_opportunities: "{output}/repetitive_indels/{species}/{sample}/{model}/merged/opportunities.parquet"
  repetitive_plots:                "{plots}/repetitive_indels/{species}/{sample}/{model}/plots.pdf"
  repetitive_results_calls:        "{results}/repetitive_indels/{species}/{sample}/{model}/indels.tsv"
  repetitive_results_opportunities: "{results}/repetitive_indels/{species}/{sample}/{model}/opportunities.parquet"
  repetitive_results_report:       "{results}/repetitive_indels/{species}/{sample}/{model}/filter_report.tsv"
  repetitive_results_classified:   "{results}/repetitive_indels/{species}/{sample}/{model}/indels_classified.tsv"
  repetitive_classification_reads: "{results}/repetitive_indels/{species}/{sample}/classification_reads.tsv"

# ---------------------------------------------------------------------------
# Parameters. Every number the workflows use comes from here.
# ---------------------------------------------------------------------------

# Workflow 1.
precompute:
  # Unresolved haplotypes are found per window of this many bp, one job each.
  unresolved_window_size: 40_000_000
  # A region is the span of the reads sharing a mismatch with the assembly: at
  # least unresolved_min_reads reads with the same base, each at base quality
  # unresolved_min_base_quality or more.
  unresolved_min_reads: 2
  unresolved_min_base_quality: 40
  # The diploid assembly holds both haplotypes' contigs, told apart by how
  # their names start (hifiasm's h1tg and h2tg). Call-carrying reads are also
  # aligned to each haplotype alone (the hap1/hap2 test).
  haplotype_prefixes:
    hap1: h1tg
    hap2: h2tg
  # Each SMRT Cell's highest base quality is taken from this many of the
  # sample's first alignments, for final filtering's Q40 rule.
  smrt_cell_reads: 100_000

# Workflow 2.
repeats:
  models: [M0, M1, M2]
  # Tandem repeat periods annotated by the models. Homopolymers (k = 1) and
  # longer periods are the excluded group, below.
  periods: [2, 3, 4, 5, 6]
  # M0 and M2, mreps -exp: at least this many full copies.
  mreps_min_exponent: 3
  # M2, mreps -res: substitutions allowed between adjacent copies.
  m2_resolution: 1
  # M1, TRF: match mismatch indel PM PI minscore. With match weight 2 a pure
  # tract needs at least minscore/2 bp, about 25 bp.
  trf_params: "2 7 7 80 10 50"
  # M1, TRF runs on windows of a contig, one job each, because its runtime
  # explodes in long satellite arrays. Windows overlap by trf_overlap so a
  # tract crossing a boundary is seen whole; a longer tract can be cut in two.
  trf_window_size: 5_000_000
  trf_overlap: 1_000_000
  # The excluded group (decisions Q8, Q16): masked from workflow 3; workflow 4
  # drops the tracts that overlap a homopolymer run or a sub-window TRF didn't
  # finish, but not those that only overlap a long-period tract (ticket 34).
  # Homopolymers: runs of one base at least this long.
  homopolymer_min_length: 6
  # Tandem repeats with periods from max(periods) + 1 up to this (TRF's
  # largest), found by TRF with M1's trf_params.
  long_period_max: 2000
  # Up to period 2000, TRF slows down with the length of a satellite array in
  # its window, so each long-period job (one per M1 window) runs TRF on
  # smaller sub-windows in turn (ticket 36). Each sub-window is fetched with
  # the overlap on each side: room for five copies of the longest period.
  long_period_sub_window_size: 500_000
  long_period_overlap: 10_000
  # A sub-window TRF doesn't finish within this many seconds is excluded
  # whole: it is most likely a satellite array. Away from satellites TRF takes
  # seconds. Its window BED marks it timed_out; excluded_summary.tsv sums them.
  long_period_timeout: 1800

# Workflows 3 and 4.
scan:
  # Each contig is scanned in windows of this many bp.
  window_size: 10_000_000
  # Workflow 3's windows for samples too heavy at window_size: at 10 Mb (and
  # 20 GB a window) their scans ran out of memory or past 4 h of CPU, while
  # the other tissue samples' finished (ticket 52). Workflow 4 keeps window_size.
  window_size_by_sample:
    rhesus_macaque:      {R21008: 2_500_000, R22013: 2_500_000}
    chimp:               {yoran: 2_500_000}
    gibbon:              {pink_eric: 2_500_000}
    long_tailed_macaque: {J12013: 5_000_000}
    marmoset:            {lambiek: 5_000_000, sidonia: 5_000_000}
  # Workflow 3's memory a window, GB, for samples that need more than
  # indel_mutation_call.py gives them (40 for Revio samples with methylation
  # bins, 20 for tissue samples, else 10): at 5 Mb and 20 GB, 50 of J12013's
  # 313 scan jobs ran out of memory (ticket 54).
  window_memory_gb_by_sample:
    long_tailed_macaque: {J12013: 30}
  # Workflow 3 runs this many windows in one job, at the same time, one core
  # each (fewer jobs; a job takes as long as its slowest window). The job's
  # memory is the window's times this.
  windows_per_job: 4
  # Workflow 3 merges the windows of contigs adding up to this many bp in one
  # job, one contig after the other: in the pilot, chk's merges took 1.5 min
  # (calls and reads) and 0.4 min (opportunities) per contig on average, 9.8
  # h and 2.5 h for its 414 contigs (5.9 Gb), so about an hour per job.
  merge_bp_per_job: 500_000_000
  # A tissue sample's opportunity sums take contigs adding up to at most this
  # many bp in one job: its tissues split the window tables. pink_eric's took
  # about 5 min per GB of gzipped window tables, with about 0.15 GB per Mb of
  # contig, so 500 Mb took about 6 h, 200 Mb about 2.5 h (ticket 55).
  tissue_sum_bp_per_job: 200_000_000
  # Only positions whose depth is within these multiples of the sample's mean
  # coverage are scanned.
  coverage_band: [0.5, 2.0]
  # Workflow 3: the smallest and largest InDels called outside repeats, in bp.
  indel_sizes: [1, 3]
  # Each call carries this many bases of the assembly on each side of its
  # anchor, so sites can be compared between individuals later.
  flank_width: 25
  # Workflow 4: a read counts for a tract, opportunity and calls, only if its
  # alignment covers the tract and this many bp on each side (Q22). Each
  # record carries the read's flank on each side, binned by
  # strata.read_end_distance_bins, so a longer flank can be required later.
  min_tract_flank: 25

# The keys calls and opportunities are both split by (scripts/strata.py), and
# the bins they use.
strata:
  # The lowest share of covering subreads that match, among the bases tested.
  subread_support_bins: [0.8, 0.9, 1.0]
  # kmerQ_pass: whether every base tested has at least this Phred quality.
  min_kmerq: 93
  # Workflow 3 (ticket 49): the bins of inner_flank_q, the lowest base quality
  # of L1 and R1, and of outer_flank_q, that of L2 and R2
  # (artefact_descriptions/kmerq_results.md).
  flank_quality_bins: [60, 93]
  # Workflow 3, calls only: an insertion call's inserted_bases_pass is "pass"
  # if every inserted base has at least this Phred quality.
  min_inserted_quality: 93
  # Workflow 3's opportunity cube (ticket 49): without these keys, and with
  # these bins in place of the ones above, so its own keys don't make it
  # bigger than before them. On chk's mirror window the cube had 17.3 M key
  # combinations before ticket 49, 59.7 M with its keys, and 18.6 M with these
  # (the scan: 57 min of CPU, 3.6 GB at most). The calls keep the raw np,
  # mapQ, fn and rn.
  nonrepetitive_without: [strand_passes_bin]
  nonrepetitive_bins:
    nearby_event_bins: [10, 20, 50, 100, 1000]
    mapq_bins: [1, 20, 60]
    passes_bins: [7, 12, 17]
  # Read length, bp.
  read_length_bins: [4000, 8000, 12000, 16000, 20000]
  # Distance from the anchor to the nearer end of the read's alignment, bp;
  # in workflow 4, from the tract, and its flank on each side.
  read_end_distance_bins: [25, 100, 300, 500, 1000]
  # The read's mapping quality to the diploid assembly.
  mapq_bins: [1,10, 20, 30, 40, 50, 60]
  # np: the read's passes.
  passes_bins: [5, 7, 10, 12, 15, 18, 20, 25, 30]
  # rq: the read's predicted accuracy.
  accuracy_bins: [0.99, 0.999, 0.9999]
  # The full passes on the weaker strand of the molecule: the smaller of fn and rn.
  strand_passes_bins: [2, 5, 10]
  # Distance from the anchor to the read's nearest other InDel or mismatch, bp.
  nearby_event_bins: [5, 10, 20, 25, 35, 50, 100, 300, 500, 1000]
  # Workflow 4: the tract's copies, and its purity (model_purity, %).
  tract_copies_bins: [5, 10, 20, 50]
  tract_purity_bins: [90, 95, 99, 100]

# The definition of a final call (Q7), applied by final_filtering.py to the
# calls and the opportunities alike. Each filter keeps the rows whose key has
# one of the values listed. A filter on a key that is NA throughout a sample,
# a tag its platform lacks, is skipped for it and noted in the filter report
# (Q15). The thresholds are to be tuned after the rerun (Q13).
final_filters:
  # Both workflows.
  keep: {}
  # Workflow 3 (ticket 49), on calls and opportunities alike: kmerQ by
  # position, the proposed rule of artefact_descriptions/kmerq_results.md (L1
  # and R1 at Q93, L2 and R2 at Q60 or more), and no masked base right after a
  # deletion (artefact_descriptions/false_positive_deletions.md). Nothing is
  # filtered on the read end: read_end_distance_bin is a column and a key.
  # Other keys tested there, not applied yet:
  #   junction_disagreement: ["no"]     a disagreeing subread at L1 or R1
  #   read_length_bin: ["8000-12000", "12000-16000", "16000-20000", ">=20000"]
  #   rq_bin, subread_support, nearby_event_bin: the plan's other candidate filters
  #   repeats_next: ["no", "NA"]        helps 2 bp deletions only, which a keep
  #                                     filter can't yet restrict to one size
  nonrepetitive_keep:
    inner_flank_q: [">=93"]
    outer_flank_q: ["60-93", ">=93"]
    base_after_masked: ["no"]
  # Workflow 3, on the calls only: the opportunities can't take these tests
  # (Q7), so each also lowers the rate by the real calls it removes. An
  # insertion's inserted bases at min_inserted_quality, the rest of the
  # proposed kmerQ rule: the insertions' rate then needs the correction s of
  # kmerq_results.md. The haploid check (ticket 18) and the hap1/hap2 test
  # (ticket 19): which a final call must pass is ticket 43. NA is kept: a call
  # that can't be checked.
  nonrepetitive_calls_only:
    inserted_bases_pass: ["pass", "NA"]
    haploid_check: ["True", "NA"]
    hap1_check: ["True", "NA"]
    hap2_check: ["True", "NA"]
  # Workflow 4: kmerQ as before, and tracts at least 100 bp from the read's
  # ends.
  repeat_keep:
    kmerQ_pass: [pass]
    read_end_distance_bin: ["100-300", "300-500", "500-1000", ">=1000"]
  # SMRT Cells none of whose reads has a base quality above this (precompute's
  # smrt_cells.tsv) are taken to be capped at it, and dropped from both
  # tables (Q12, Q17).
  capped_quality: 40

# Workflow 3's rates by filter (ticket 56): filter_rates.py's funnel applies
# final filtering's steps, then these, in this order, to the candidate calls
# and opportunities alike, and gives the rate after each step. The candidates
# of ticket 49's session filters (subreads_analysis/filters/our_funnel.py):
# subread support at least 0.8, no other event within 100 bp (10 bp there),
# rq at least 0.999, no subread disagreeing at L1 or R1, reads of 8 kb or
# more. The
# funnel's rows are split by the keys under funnel_by, so the rate of each
# tissue and methylation bin can be plotted after any step.
filter_rates:
  funnel_by: [tissue, methylation_bin]
  nonrepetitive_steps:
    subread_support: ["0.8-0.9", "0.9-1", ">=1"]
    nearby_event_bin: ["100-1000", ">=1000", "none"]
    junction_disagreement: ["no"]
    read_end_distance_bin: ["300-500", "500-1000", ">=1000"]
    repeats_next: ["no", "NA"]
    kmerQ_pass: ["pass"]
    #rq_bin: ["0.999-0.9999", ">=0.9999"]
    #read_length_bin: ["8000-12000", "12000-16000", "16000-20000", ">=20000"]

# Germline/somatic classification of reads with methylation scores, by
# join_read_classification.sh (a bin on every call) and
# classification_read_counts.sh (reads and CpGs per bin).
classification:
  # Germline cell types: the likelihood columns whose names start with this.
  germline_prefix: "Sperm."
  # Somatic cell types: these likelihood columns.
  somatic_types: [Blood.Monocytes, Bladder.SmoothMuscle, Breast.BasalEpithelial,
                  Lung.AlveolarMacrophages, Colon.RightEndocrine, Thyroid.Epithelial]
  # A read's score is its best germline likelihood minus its best somatic one.
  # It takes the label of the first edge it is below, or the last label, so
  # there is one more label than there are edges.
  bin_edges:  [-10, -8, -6, -4, -2, -1, 0, 1, 2, 4, 6, 8, 10]
  bin_labels: [-12, -10, -8, -6, -4, -2, -1, 0, 1, 2, 4, 6, 8, 12]
