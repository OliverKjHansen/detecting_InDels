# New data of a sample sequenced again (Revio), aligned to that sample's
# assembly: new data -> the sample. The new data are a sample of their own from
# the reads on (their BAM at the standard path, coverage, SMRT Cells, unresolved
# haplotypes, methylation bins, scans); the assembly, its contigs and haplotypes
# and workflow 2's repeats are the sample's, made once (pipeline.ASSEMBLY_LAYOUT).
